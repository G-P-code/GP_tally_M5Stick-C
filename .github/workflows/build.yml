# Builds the firmware on every push and pull request.
#
# On a tag v<version> (e.g. v4.6) it also creates a DRAFT GitHub Release with
# both images attached. Nothing is published until the draft is reviewed and
# published by hand on GitHub. The tag must match FW_VERSION in
# include/config.h, otherwise the run stops before building.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create the draft release (tag runs only)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          ver=$(sed -n 's/^#define[[:space:]]*FW_VERSION[[:space:]]*"\(.*\)".*/\1/p' include/config.h)
          [ -n "$ver" ] || { echo "FW_VERSION not found in include/config.h"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "FW_VERSION $ver"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match FW_VERSION $ver (expected v$ver)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build
        run: pio run -e m5stickc

      - uses: actions/upload-artifact@v4
        with:
          name: GP_tally_M5StickC_v${{ steps.version.outputs.version }}
          path: release/*.bin

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          # Release notes: this version's section of CHANGELOG.md
          awk -v v="$VER" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" release/*.bin \
            --draft --title "v$VER" --notes-file notes.md
