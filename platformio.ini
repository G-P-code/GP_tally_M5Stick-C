; GP Tally M5StickC — PlatformIO build configuration
;
; Build all boards:      pio run
; Build one board:       pio run -e m5stickc-plus
; Flash over USB:        pio run -e m5stickc-plus -t upload
; Serial monitor:        pio device monitor
; Flash over Wi-Fi (OTA):
;   pio run -e m5stickc-plus-ota -t upload --upload-port <device-ip>

[platformio]
default_envs = m5stickc, m5stickc-plus

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[env]
; pioarduino = community-maintained PlatformIO platform for Arduino-ESP32 core 3.x
; 55.03.313 -> Arduino-ESP32 3.3.13 (Arduino IDE build used 3.3.12)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

build_flags =
  -Wall
  ; Same as Arduino IDE default "Core Debug Level: None" (raise to 1-5 for ESP-IDF/HAL logs)
  -DCORE_DEBUG_LEVEL=0

; Versions pinned; M5Unified covers both boards (display, buttons, IMU, power)
lib_deps =
  m5stack/M5Unified @ 0.3.0
  m5stack/M5GFX @ 0.3.0
  links2004/WebSockets @ 2.7.2
  bblanchon/ArduinoJson @ 7.4.3
  tzapu/WiFiManager @ 2.0.17

; OTA defaults (used by the *-ota envs)
[ota]
upload_protocol = espota
upload_flags =
  --auth=tallyarbiter

; ---------------------------------------------------------------------------
; Boards
; ---------------------------------------------------------------------------
; Board definitions live in boards/*.json (pioarduino ships none for StickC-Plus).
; The firmware detects the board at run time (M5Unified); the envs differ only in
; name and URL (same ESP32-PICO, 4 MB flash).
[env:m5stickc]
board = m5stack-stickc

[env:m5stickc-plus]
board = m5stack-stickc-plus

; ---------------------------------------------------------------------------
; OTA variants — pass the device IP with --upload-port
; ---------------------------------------------------------------------------
[env:m5stickc-ota]
extends = env:m5stickc, ota

[env:m5stickc-plus-ota]
extends = env:m5stickc-plus, ota
