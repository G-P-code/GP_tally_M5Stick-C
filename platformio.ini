; GP Tally M5StickC — PlatformIO build configuration
;
; One firmware for M5StickC and M5StickC-Plus (board detected at run time).
;
; Build:                 pio run
; Flash over USB:        pio run -t upload
; Serial monitor:        pio device monitor
; Flash over Wi-Fi (OTA):
;   pio run -e m5stickc-ota -t upload --upload-port <device-ip>
;
; Every build also copies release images to release/ (scripts/release_bins.py).

[platformio]
default_envs = m5stickc

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[env]
; pioarduino = community-maintained PlatformIO platform for Arduino-ESP32 core 3.x
; 55.03.313 -> Arduino-ESP32 3.3.13 (Arduino IDE build used 3.3.12)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

extra_scripts = post:scripts/release_bins.py

build_flags =
  -Wall
  ; Same as Arduino IDE default "Core Debug Level: None" (raise to 1-5 for ESP-IDF/HAL logs)
  -DCORE_DEBUG_LEVEL=0

; Versions pinned; M5Unified covers both boards (display, buttons, IMU, power)
lib_deps =
  m5stack/M5Unified @ 0.3.0
  m5stack/M5GFX @ 0.3.0
  links2004/WebSockets @ 2.7.2
  bblanchon/ArduinoJson @ 7.4.3
  tzapu/WiFiManager @ 2.0.17

; OTA defaults (used by the *-ota envs)
[ota]
upload_protocol = espota
upload_flags =
  --auth=tallyarbiter

; ---------------------------------------------------------------------------
; Board
; ---------------------------------------------------------------------------
; boards/m5stack-stickc.json (pioarduino ships no StickC definition). The same
; ESP32-PICO with 4 MB flash in StickC and StickC-Plus; M5Unified tells them
; apart at run time, so one image serves both.
[env:m5stickc]
board = m5stack-stickc

; OTA — pass the device IP with --upload-port
[env:m5stickc-ota]
extends = env:m5stickc, ota
